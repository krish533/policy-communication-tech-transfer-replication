name: Reproduce paper

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Reproduce publication-facing analysis
        run: python code/reproduce_submission.py

      - name: Verify publication-facing numerical targets
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import pandas as pd

          r = pd.read_csv('results/expanded_manual_sample_results.csv')
          assert set(r['sample']) == {'expanded34', 'strict29'}
          assert r.groupby('sample')['events'].first().to_dict() == {'expanded34': 34, 'strict29': 29}

          lic34 = r[(r['sample'] == 'expanded34') & (r['outcome'] == 'ln_licenses')].iloc[0]
          lic29 = r[(r['sample'] == 'strict29') & (r['outcome'] == 'ln_licenses')].iloc[0]

          stable34 = {
              'gap': 0.49498236075777713,
              'cluster_se': 0.1395573357139685,
              'pre_p': 0.3197216307692614,
          }
          stable29 = {
              'gap': 0.4987653009188467,
              'cluster_se': 0.13256833385897276,
              'pre_p': 0.5166507499863187,
          }
          for k, v in stable34.items():
              assert abs(float(lic34[k]) - v) < 1e-8, (k, lic34[k], v)
          for k, v in stable29.items():
              assert abs(float(lic29[k]) - v) < 1e-8, (k, lic29[k], v)

          # Monte Carlo labels/seeds are fixed. A few assignments can sit at the
          # floating-point comparison boundary on different BLAS platforms, so
          # enforce the publication-relevant tolerance rather than bit identity.
          assert abs(float(lic34['permutation_p']) - 0.032) < 0.001
          assert abs(float(lic29['permutation_p']) - 0.026) < 0.001

          e34 = pd.read_csv('data/derived/final_stacked_event_dataset_expanded34.csv', low_memory=False)
          e29 = pd.read_csv('data/derived/final_stacked_event_dataset_strict29.csv', low_memory=False)
          assert e34['stack'].nunique() == 34
          assert e29['stack'].nunique() == 29
          assert set(e34['event_direction_meta'].dropna()) == {'up', 'down'}
          assert set(e29['event_direction_meta'].dropna()) == {'up', 'down'}
          assert len(e34) == 26679
          assert len(e29) == 23186

          annual = pd.read_csv('results/supporting_annual_lags.csv')
          fm1 = annual[(annual['outcome'] == 'filing_margin') & (annual['lag'] == 1)].iloc[0]
          fm2 = annual[(annual['outcome'] == 'filing_margin') & (annual['lag'] == 2)].iloc[0]
          assert int(fm1['n']) == 2271
          assert int(fm2['n']) == 2132
          assert abs(float(fm1['beta']) - 0.939) < 0.005
          assert abs(float(fm1['se']) - 0.505) < 0.005
          assert abs(float(fm2['beta']) - 1.201) < 0.005
          assert abs(float(fm2['se']) - 0.520) < 0.005

          supporting = json.loads(Path('results/supporting_annual_summary.json').read_text())
          assert supporting['placebo']['draws'] == 1000
          assert abs(float(supporting['placebo']['placebo_p']) - 0.017) < 0.001

          for path in [
              'manuscript/figures/fig1_event_study_expanded.pdf',
              'manuscript/figures/figA1_leave_one_out_expanded.pdf',
          ]:
              assert Path(path).is_file(), path

          print('Publication-facing and supporting numerical checks passed.')
          PY

      - name: Reproduce frozen 25-event benchmark
        run: python code/revision_replication.py

      - name: Compile manuscript
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: manuscript
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Stage clean replication artifact
        run: |
          set -euo pipefail
          rm -rf artifact
          mkdir -p artifact/code artifact/data/derived artifact/results artifact/manuscript
          cp README.md REPRODUCIBILITY.md requirements.txt artifact/
          cp -R code/. artifact/code/
          cp data/revision_codes_manual.csv data/revision_codes_rereview37.csv data/README.md artifact/data/
          cp -R data/derived/. artifact/data/derived/
          cp -R results/. artifact/results/
          cp -R replication artifact/
          cp -R manuscript/. artifact/manuscript/
          rm -f artifact/manuscript/*.aux artifact/manuscript/*.log artifact/manuscript/*.out artifact/manuscript/*.toc
          python --version > artifact/PYTHON_VERSION.txt
          python -m pip freeze | sort > artifact/PIP_FREEZE.txt
          find artifact -type f ! -name 'PACKAGE_SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum > artifact/PACKAGE_SHA256SUMS.txt

      - name: Upload manuscript and replication artifact
        uses: actions/upload-artifact@v4
        with:
          name: policy-communication-tech-transfer-replication
          path: artifact/
          if-no-files-found: error
          retention-days: 90
